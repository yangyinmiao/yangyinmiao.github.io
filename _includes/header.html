<header class="site-header">
  <a class="brand" href="{{ '/' | relative_url }}">
    <span class="brand-mark" aria-hidden="true">{{ site.data.profile.name | slice: 0, 2 | upcase }}</span>
    <span>{{ site.data.profile.name | default: site.title }}</span>
  </a>
  <nav class="site-nav" aria-label="Primary">
    <a href="{{ '/blog/' | relative_url }}"><span data-i18n="nav.blog">Blog</span></a>
    <a href="{{ '/notes/' | relative_url }}"><span data-i18n="nav.notes">Notes</span></a>
    <a href="{{ '/projects/' | relative_url }}"><span data-i18n="nav.projects">Projects</span></a>
    <a href="{{ '/about/' | relative_url }}"><span data-i18n="nav.about">About</span></a>
    <button class="lang-toggle" type="button" data-lang-toggle aria-label="Switch language">中文</button>
  </nav>
</header>
