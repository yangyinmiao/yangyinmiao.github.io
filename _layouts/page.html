---
layout: default
---

<article class="card prose">
  <header class="page-header">
    <div class="eyebrow" data-i18n="page.kind">Page</div>
    {% if page.i18n_key %}
      <h1 data-i18n="page.title.{{ page.i18n_key }}">{{ page.title }}</h1>
    {% else %}
      <h1>{{ page.title }}</h1>
    {% endif %}
  </header>
  {{ content }}
</article>
