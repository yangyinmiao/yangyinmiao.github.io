---
layout: default
---

<article class="card prose post">
  <header class="page-header">
    <div class="eyebrow">{{ page.kind | default: "Article" }}</div>
    <h1>{{ page.title }}</h1>
    <p class="meta">
      <time>{{ page.date | date: "%B %d, %Y" }}</time>
      <span>·</span>
      <span>{{ page.author | default: site.title }}</span>
    </p>
  </header>
  {{ content }}
</article>
